---
- name: Bootstrap Amazon SSM Agent on legacy Linux hosts
  hosts: legacy_linux
  become: true
  gather_facts: true
  serial: "{{ rollout_batch | default('20%') }}"

  tasks:
    - name: Validate supported architecture
      ansible.builtin.assert:
        that: ansible_architecture in ['x86_64', 'aarch64']
        fail_msg: "Unsupported architecture: {{ ansible_architecture }}"

    - name: Install SSM Agent on Amazon Linux
      ansible.builtin.package:
        name: amazon-ssm-agent
        state: present
      when: ansible_distribution in ['Amazon', 'Amazon Linux']

    - name: Install SSM Agent RPM on Red Hat family
      ansible.builtin.dnf:
        name: "https://s3.{{ aws_region }}.amazonaws.com/amazon-ssm-{{ aws_region }}/latest/linux_{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}/amazon-ssm-agent.rpm"
        state: present
        disable_gpg_check: false
      when:
        - ansible_os_family == 'RedHat'
        - ansible_distribution not in ['Amazon', 'Amazon Linux']

    - name: Install SSM Agent DEB on Debian family
      ansible.builtin.apt:
        deb: "https://s3.{{ aws_region }}.amazonaws.com/amazon-ssm-{{ aws_region }}/latest/debian_{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}/amazon-ssm-agent.deb"
      when: ansible_os_family == 'Debian'

    - name: Enable and start SSM Agent
      ansible.builtin.service:
        name: amazon-ssm-agent
        enabled: true
        state: started

    - name: Confirm SSM Agent is active
      ansible.builtin.command: systemctl is-active amazon-ssm-agent
      register: ssm_status
      changed_when: false
      failed_when: ssm_status.stdout.strip() != 'active'
