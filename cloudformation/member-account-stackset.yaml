AWSTemplateFormatVersion: '2010-09-09'

Description: Minimal EC2 disk monitoring configuration.

Parameters:

  MonitoringSinkIdentifier:
    Type: String
    Description: OAM Sink ARN from the monitoring account.

  MonitoringTagValue:
    Type: String
    Default: enabled

  AgentConfigParameterName:
    Type: String
    Default: /central-monitoring/cloudwatch-agent/linux

Resources:

  # ------------------------------------------------------------
  # EC2 / SSM / CLOUDWATCH AGENT ROLE
  # ------------------------------------------------------------
  DiskMonitorRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-EC2MonitoringRole'

      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com
            Action:
              - sts:AssumeRole

      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
        - arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy

  DiskMonitorInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref DiskMonitorRole

  # ------------------------------------------------------------
  # CLOUDWATCH AGENT CONFIGURATION
  # ------------------------------------------------------------
  CloudWatchAgentConfig:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Ref AgentConfigParameterName
      Type: String

      Value: |
        {
          "agent": {
            "metrics_collection_interval": 300,
            "run_as_user": "root"
          },
          "metrics": {
            "namespace": "CWAgent",

            "append_dimensions": {
              "InstanceId": "${aws:InstanceId}"
            },

            "metrics_collected": {
              "disk": {
                "measurement": [
                  "used_percent"
                ],
                "metrics_collection_interval": 300,
                "resources": [
                  "*"
                ],
                "ignore_file_system_types": [
                  "sysfs",
                  "devtmpfs",
                  "tmpfs",
                  "overlay",
                  "squashfs",
                  "proc",
                  "procfs"
                ],
                "drop_device": true
              }
            }
          }
        }

  # ------------------------------------------------------------
  # INSTALL CLOUDWATCH AGENT
  # ------------------------------------------------------------
  InstallCloudWatchAgent:
    Type: AWS::SSM::Association
    Properties:
      Name: AWS-ConfigureAWSPackage

      Parameters:
        action:
          - Install
        installationType:
          - Uninstall and reinstall
        name:
          - AmazonCloudWatchAgent
        version:
          - latest

      Targets:
        - Key: tag:Monitoring
          Values:
            - !Ref MonitoringTagValue

  # ------------------------------------------------------------
  # CONFIGURE CLOUDWATCH AGENT
  # ------------------------------------------------------------
  ConfigureCloudWatchAgent:
    Type: AWS::SSM::Association
    DependsOn: InstallCloudWatchAgent

    Properties:
      Name: AmazonCloudWatch-ManageAgent

      Parameters:
        action:
          - configure
        mode:
          - ec2
        optionalConfigurationSource:
          - ssm
        optionalConfigurationLocation:
          - !Ref AgentConfigParameterName
        optionalRestart:
          - 'yes'

      Targets:
        - Key: tag:Monitoring
          Values:
            - !Ref MonitoringTagValue

  # ------------------------------------------------------------
  # OAM LINK
  # ------------------------------------------------------------
  MonitoringLink:
    Type: AWS::Oam::Link

    Properties:
      LabelTemplate: '$AccountName'

      ResourceTypes:
        - AWS::CloudWatch::Metric

      SinkIdentifier: !Ref MonitoringSinkIdentifier

Outputs:

  InstanceProfileName:
    Description: IAM instance profile for monitored EC2 instances
    Value: !Ref DiskMonitorInstanceProfile

  OamLinkArn:
    Description: OAM Link ARN
    Value: !GetAtt MonitoringLink.Arn