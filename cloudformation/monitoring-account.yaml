AWSTemplateFormatVersion: '2010-09-09'

Description: Minimal central monitoring account for EC2 disk metrics.

Parameters:
  MemberAccountId:
    Type: String
    Default: '685385421611'

  DashboardName:
    Type: String
    Default: Sandbox-EC2-Disk-Monitoring

Resources:

  # ------------------------------------------------------------
  # OAM SINK
  # ------------------------------------------------------------
  MonitoringSink:
    Type: AWS::Oam::Sink
    Properties:
      Name: !Sub '${AWS::StackName}-sink'

      Policy:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowMemberAccount
            Effect: Allow
            Principal:
              AWS: !Ref MemberAccountId
            Action:
              - oam:CreateLink
              - oam:UpdateLink
            Resource: '*'
            Condition:
              ForAllValues:StringEquals:
                oam:ResourceTypes:
                  - AWS::CloudWatch::Metric

  # ------------------------------------------------------------
  # DASHBOARD
  # ------------------------------------------------------------
  DiskDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Ref DashboardName
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "metric",
              "x": 0,
              "y": 0,
              "width": 24,
              "height": 8,
              "properties": {
                "title": "EC2 Disk Utilization",
                "view": "timeSeries",
                "region": "${AWS::Region}",
                "stat": "Maximum",
                "period": 300,
                "metrics": [
                  [
                    "CWAgent",
                    "disk_used_percent",
                    "InstanceId",
                    "*"
                  ]
                ]
              }
            }
          ]
        }

  # ------------------------------------------------------------
  # SIMPLE DISK ALARM
  # ------------------------------------------------------------
  DiskAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-disk-high'
      AlarmDescription: EC2 disk utilization above 80%

      Namespace: CWAgent
      MetricName: disk_used_percent

      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 2

      Threshold: 80
      ComparisonOperator: GreaterThanOrEqualToThreshold

      TreatMissingData: notBreaching

Outputs:

  SinkArn:
    Description: OAM Sink ARN for the member account
    Value: !GetAtt MonitoringSink.Arn

  DashboardName:
    Value: !Ref DashboardName